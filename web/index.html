<html>

<head>
  <title>Death Star Manager</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" type="text/css" href="css/estilos.css" />
  <link rel="icon" type="image/png" href="img/favicon.png">
  <style>
    .contenedor-index {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 120px);
      gap: 30px;
    }

    .icono {
      font-size: 5em;
      color: #ff3333;
      text-shadow: 0 0 20px rgba(255, 51, 51, 0.8);
      margin-bottom: 10px;
      animation: pulse 2s infinite;
    }

    .menu-botones {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 450px;
    }

    .btn-menu {
      text-align: center;
      padding: 15px 20px;
      font-size: 1.1em;
      letter-spacing: 3px;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .logo-contenedor {
      margin-bottom: 10px;
      animation: pulse-img 2s infinite;
    }

    .logo-imagen {
      width: 250px;
      height: 250px;
      background-color: #ff3333;
      -webkit-mask-image: url("img/logo.png");
      -webkit-mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-image: url("img/logo.png");
      mask-size: contain;
      mask-repeat: no-repeat;
      mask-position: center;
    }

    @keyframes pulse-img {
      0% {
        opacity: 0.8;
        filter: drop-shadow(0 0 10px rgba(255, 51, 51, 0.5));
      }

      50% {
        opacity: 1;
        filter: drop-shadow(0 0 30px rgba(255, 51, 51, 1));
      }

      100% {
        opacity: 0.8;
        filter: drop-shadow(0 0 10px rgba(255, 51, 51, 0.5));
      }
    }
  </style>
</head>

<body>
  <h1>Estación de Combate Orbital - Proyecto Death Star</h1>
  <div class="contenedor-index">
    <div class="logo-contenedor">
      <div class="logo-imagen"></div>
    </div>
    <h3 style="color: #555; letter-spacing: 4px; text-transform: uppercase">
      Módulos de operación
    </h3>

    <div class="menu-botones">
      <a href="planetas.jsp" class="btn-principal btn-menu">OBJETIVOS PLANETARIOS</a>
      <a href="soldados.jsp" class="btn-principal btn-menu">PELOTÓN IMPERIAL</a>
      <a href="planetas.jsp" class="btn-principal btn-menu">PLACEHOLDER</a>
    </div>
  </div>
</body>

</html>
